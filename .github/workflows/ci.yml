name: CI

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests (Pest)
        run: vendor/bin/pest
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APPLE_TEAM_ID: TESTTEAMID
          APPLE_KEY_ID: TESTKEY01
          APPLE_AUTH_KEY: |
            -----BEGIN PRIVATE KEY-----
            MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgdiSaH7SnLuFlUvTr
            F7wNVumn+zvvdE+OOcY5pTZ8nvKhRANCAAQXjlAm3wSWMacTLVXzxSpvb0lK1L00
            Fb7lzKzF2pX1IZuFdFQIPCJEzbGYsSVtlrDiRd7A2skhejt+3PE4/UfK
            -----END PRIVATE KEY-----
